<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixun Doom Lite Dart</title>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; padding: 15px; }
        canvas { background: #1e293b; border-radius: 12px; border: 2px solid #38bdf8; }
        button { background: #f43f5e; color: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>🎯 DOOM LITE DART</h2>
    <p>Skor: <span id="score">0</span></p>
    <canvas id="dartCanvas" width="300" height="300"></canvas>
    <br>
    <button onclick="shoot()">🔥 LEMPAR DART!</button>

    <script>
        const canvas = document.getElementById("dartCanvas");
        const ctx = canvas.getContext("2d");
        let score = 0;

        let target = { x: 150, y: 100, radius: 40, speed: 3, dir: 1 };
        let dart = { x: 150, y: 270, active: false };

        function shoot() {
            if(!dart.active) {
                dart.x = 150;
                dart.y = 270;
                dart.active = true;
            }
        }

        function update() {
            // Target gerak ke kiri-kanan
            target.x += target.speed * target.dir;
            if(target.x > 250 || target.x < 50) target.dir *= -1;

            // Dart meluncur ke atas
            if(dart.active) {
                dart.y -= 12;
                // Kena Papan Target
                let dist = Math.hypot(dart.x - target.x, dart.y - target.y);
                if(dist < target.radius) {
                    score += 50;
                    document.getElementById("score").innerText = score;
                    dart.active = false;
                    target.speed += 0.5;
                }
                if(dart.y < 0) dart.active = false; // Meleset
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Gambar Target Papan Dart
            ctx.fillStyle = "#f43f5e"; ctx.beginPath(); ctx.arc(target.x, target.y, target.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(target.x, target.y, target.radius - 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#f43f5e"; ctx.beginPath(); ctx.arc(target.x, target.y, target.radius - 30, 0, Math.PI*2); ctx.fill();

            // Gambar Panah Dart
            if(dart.active) {
                ctx.font = "25px serif";
                ctx.fillText("🎯", dart.x - 10, dart.y);
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
