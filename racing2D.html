<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixun 2D Racing</title>
    <style>
        body { background: #0f172a; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 15px; }
        canvas { background: #334155; border-radius: 12px; border: 2px solid #64748b; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 20px; }
        button { background: #38bdf8; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; color: #0f172a; }
        #gameOver { display: none; color: #f43f5e; font-size: 22px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🏎️ LIXUN 2D RACING</h2>
    <p>Skor: <span id="score">0</span></p>
    <canvas id="raceCanvas" width="300" height="350"></canvas>
    
    <div id="gameOver">
        💀 TABRAKAN! GAME OVER!
        <br><button onclick="restartGame()" style="margin-top:10px; background:#f43f5e; color:white;">🔄 MAIN LAGI</button>
    </div>

    <div class="controls" id="btnGroup">
        <button onclick="moveLeft()">◀️ KIRI</button>
        <button onclick="moveRight()">KANAN ▶️</button>
    </div>

    <script>
        const canvas = document.getElementById("raceCanvas");
        const ctx = canvas.getContext("2d");
        let isGameOver = false, score = 0;

        let player = { x: 125, y: 280, w: 50, h: 50, emoji: "🏎️" };
        let enemy = { x: 125, y: -50, w: 50, h: 50, speed: 5, emoji: "🚘" };

        function moveLeft() { if(!isGameOver && player.x > 20) player.x -= 80; }
        function moveRight() { if(!isGameOver && player.x < 200) player.x += 80; }

        function update() {
            if(isGameOver) return;
            enemy.y += enemy.speed;

            if(enemy.y > 350) {
                enemy.y = -50;
                enemy.x = Math.random() > 0.5 ? 45 : 205; // Random jalur kiri / kanan
                score += 10;
                document.getElementById("score").innerText = score;
                enemy.speed += 0.3;
            }

            // Hitbox Tabrakan
            if (Math.abs(player.x - enemy.x) < 40 && Math.abs(player.y - enemy.y) < 40) {
                isGameOver = true;
                document.getElementById("gameOver").style.display = "block";
                document.getElementById("btnGroup").style.display = "none";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Garis Jalanan
            ctx.strokeStyle = "#ffffff";
            ctx.setLineDash([20, 15]);
            ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, 350); ctx.stroke();

            // Player & Enemy
            ctx.font = "35px serif";
            ctx.fillText(player.emoji, player.x, player.y);
            ctx.fillText(enemy.emoji, enemy.x, enemy.y);
        }

        function restartGame() {
            isGameOver = false; score = 0; enemy.speed = 5; enemy.y = -50;
            document.getElementById("score").innerText = 0;
            document.getElementById("gameOver").style.display = "none";
            document.getElementById("btnGroup").style.display = "flex";
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
